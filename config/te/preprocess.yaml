dataset: "IndicTTS_Telugu"

path:
  raw_path: "./raw_data/Telugu/audio"
  preprocessed_path: "./preprocessed_data/Telugu"

preprocessing:
  text:
    text_cleaners: ["telugu_cleaners"]
    language: "te"
    tokenization: "grapheme"
    vocab_path: "config/te/vocab.json"
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: "phoneme_level"
    normalization: true
  energy:
    feature: "phoneme_level"
    normalization: true
